[package]
name = "audiotheorem"
version = "0.2.0"
edition = "2021"
authors = [ "Hans W. Uhlig <huhlig@gmail.com>", "Richard I. Christopher <rchris@neotec.dev>" ]
description = "An attempt at encoding musical theory into a usable library"
resolver = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "audiotheorem"
path = "src/main.rs"
required-features = ["runtime"]

[features]
default = ["runtime"]
runtime = ["dep:midir", "dep:libloading", "dep:winit", "dep:env_logger", "dep:pollster", "dep:wgpu", "dep:bytemuck", "dep:image", "dep:cgmath", "dep:rustysynth", "dep:rodio", "dep:crossbeam-channel", "dep:tokio", "dep:crossbeam-utils"]

[dependencies]
byteorder = "1.3.4"
tracing = "0.1.13"
midir = { version = "0.9.1", optional = true }
libloading = { version = "0.7.4", optional = true }
winit = { version = "0.28.2", optional = true }
env_logger = { version = "0.10.0", optional = true }
pollster = { version = "0.3.0", optional = true }
wgpu = { version = "0.15", optional = true }
bytemuck = { version = "1.13.1", features = [ "derive" ] , optional = true }
image = { version = "0.24.5", optional = true }
cgmath = { version = "0.18.0", optional = true }
rustysynth = { version = "1.3.1", optional = true }
rodio = { version = "0.18.0", optional = true }
crossbeam-channel = { version = "0.5.12", optional = true }
tokio = { version = "1.37.0", features = ["full"] , optional = true }
crossbeam-utils = { version = "0.8.19", optional = true }

[[example]]
name = "test"
required-features = ["runtime"]
