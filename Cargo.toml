[package]
name = "nova-daw"
version = "0.2.0"
edition = "2021"

[features]
default = ["native"]
native = []

[dependencies]
audiotheorem = { path = "extern/musictheory-rs", default-features = false }
tokio = { version = "1.37.0", features = ["full"] }
axum = { version = "0.7.9", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "=0.15.3"
rtrb = "=0.3.2"
rustfft = "=6.4.1"
hound = "3.5.1"
claxon = "0.4.3"
parking_lot = "0.12"
futures-util = "0.3"
rand = "0.8"

[dev-dependencies]
rodio = "0.18.1"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
cc = "1.0"

[profile.release]
debug = 1
